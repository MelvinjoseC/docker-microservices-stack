apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: microservices-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: melvinjosec/notification-service:latest
          ports:
            - containerPort: 8001
          env:
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: microservices-config
                  key: RABBITMQ_HOST
            - name: HEALTH_PORT
              valueFrom:
                configMapKeyRef:
                  name: microservices-config
                  key: PORT_NOTIFICATION_HEALTH
          resources:
            limits:
              cpu: "200m"
              memory: "256Mi"
            requests:
              cpu: "50m"
              memory: "64Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
