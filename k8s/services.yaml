apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: microservices-stack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: melvinjosec/user-service:latest
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: DB_HOST
              value: "postgres"
            - name: DB_USER
              value: "devuser"
            - name: DB_PASSWORD
              value: "devpassword"
            - name: DB_NAME
              value: "microservices_db"
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: microservices-stack
spec:
  ports:
    - port: 5000
  selector:
    app: user-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: microservices-stack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
        - name: catalog-service
          image: melvinjosec/catalog-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: MONGO_URI
              value: "mongodb://devuser:devpassword@mongodb:27017/catalog_db?authSource=admin"
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: microservices-stack
spec:
  ports:
    - port: 8080
  selector:
    app: catalog-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: microservices-stack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: melvinjosec/order-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql://devuser:devpassword@postgres:5432/microservices_db"
            - name: RABBITMQ_HOST
              value: "rabbitmq"
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: microservices-stack
spec:
  ports:
    - port: 8000
  selector:
    app: order-service
---
