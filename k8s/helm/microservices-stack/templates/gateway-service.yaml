apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app: api-gateway
    {{- include "microservices-stack.labels" . | nindent 4 }}
spec:
  type: LoadBalancer
  ports:
    - port: {{ .Values.ports.gateway }}
      targetPort: {{ .Values.ports.gateway }}
  selector:
    app: api-gateway
