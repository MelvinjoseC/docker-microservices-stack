---
- name: Provision Microservices Host Environment
  hosts: all
  become: true
  
  vars:
    docker_packages:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - software-properties-common

  tasks:
    - name: Update apt cache and upgrade system packages
      apt:
        update_cache: true
        upgrade: safe
      when: ansible_os_family == "Debian"

    - name: Install system dependencies
      apt:
        name: "{{ docker_packages }}"
        state: present
      when: ansible_os_family == "Debian"

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present
      when: ansible_os_family == "Debian"

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
      when: ansible_os_family == "Debian"

    - name: Install Docker CE & Docker Compose Plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Start and enable Docker service
      service:
        name: docker
        state: started
        enabled: true

    - name: Add current user to Docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    # Security sysctl tuning for production containers
    - name: Set virtual memory maximum map count (for databases/ELK)
      sysctl:
        name: vm.max_map_count
        value: '262144'
        state: present
        reload: true

    - name: Enable IPv4 packet forwarding for container networking
      sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        state: present
        reload: true

    - name: Tune TCP maximum socket listen backlog for high throughput
      sysctl:
        name: net.core.somaxconn
        value: '65535'
        state: present
        reload: true

    - name: Tune TCP SYN backlog queue
      sysctl:
        name: net.ipv4.tcp_max_syn_backlog
        value: '8192'
        state: present
        reload: true

    - name: Configure Docker daemon log rotation and live-restore
      copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "50m",
              "max-file": "3"
            },
            "live-restore": true,
            "metrics-addr": "0.0.0.0:9323"
          }
        mode: '0644'
      notify: restart docker

  handlers:
    - name: restart docker
      service:
        name: docker
        state: restarted

    - name: Verify Docker installation
      command: docker --version
      register: docker_version
      changed_when: false

    - name: Output Docker version
      debug:
        msg: "Docker is installed: {{ docker_version.stdout }}"
