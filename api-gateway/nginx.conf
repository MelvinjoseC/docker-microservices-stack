user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json_combined escape=json
      '{"timestamp":"$time_iso8601",'
      '"remote_addr":"$remote_addr",'
      '"request_id":"$request_id",'
      '"request_method":"$request_method",'
      '"request_uri":"$request_uri",'
      '"status":$status,'
      '"body_bytes_sent":$body_bytes_sent,'
      '"request_time":$request_time,'
      '"http_referrer":"$http_referer",'
      '"http_user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;

    # Gzip settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_status 429;
    client_max_body_size 10M;

    # Upstream definitions with keepalive connection pools
    upstream user_service {
        server user-service:5000;
        keepalive 32;
    }

    upstream catalog_service {
        server catalog-service:8080;
        keepalive 32;
    }

    upstream order_service {
        server order-service:8000;
        keepalive 32;
    }

    upstream frontend_service {
        server frontend:80;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Request-ID $request_id always;

        # Custom JSON Error Pages
        error_page 429 @rate_limit_error;
        error_page 502 503 504 @upstream_error;

        location @rate_limit_error {
            default_type application/json;
            return 429 '{"error":"Too Many Requests","message":"Rate limit exceeded. Please retry after backoff.","status":429}';
        }

        location @upstream_error {
            default_type application/json;
            return 503 '{"error":"Service Unavailable","message":"Upstream microservice is unreachable or starting.","status":503}';
        }

        # Proxy timeouts and buffer tuning
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffers 16 16k;
        proxy_buffer_size 16k;

        # User Service routes
        location /api/users {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://user_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Idempotency-Key $http_x_idempotency_key;
            proxy_set_header traceparent $http_traceparent;
        }

        # Catalog Service routes
        location /api/products {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://catalog_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Idempotency-Key $http_x_idempotency_key;
            proxy_set_header traceparent $http_traceparent;
        }

        # Order Service routes
        location /api/orders {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://order_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Idempotency-Key $http_x_idempotency_key;
            proxy_set_header traceparent $http_traceparent;
        }

        # Frontend Application Routing
        location / {
            proxy_pass http://frontend_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health Check endpoint for Gateway itself
        location /health {
            access_log off;
            return 200 '{"status":"healthy","service":"api-gateway"}';
            add_header Content-Type application/json;
        }
    }
}
