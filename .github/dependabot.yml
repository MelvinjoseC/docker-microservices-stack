version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Maintain dependencies for User Service (npm)
  - package-ecosystem: "npm"
    directory: "/services/user-service"
    schedule:
      interval: "weekly"

  # Maintain dependencies for Frontend (npm)
  - package-ecosystem: "npm"
    directory: "/services/frontend"
    schedule:
      interval: "weekly"

  # Maintain dependencies for Go Catalog Service
  - package-ecosystem: "gomod"
    directory: "/services/catalog-service"
    schedule:
      interval: "weekly"

  # Maintain dependencies for Order Service (pip)
  - package-ecosystem: "pip"
    directory: "/services/order-service"
    schedule:
      interval: "weekly"

  # Maintain dependencies for Notification Service (pip)
  - package-ecosystem: "pip"
    directory: "/services/notification-service"
    schedule:
      interval: "weekly"

  # Maintain Docker images across the stack
  - package-ecosystem: "docker"
    directory: "/api-gateway"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/user-service"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/catalog-service"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/order-service"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/notification-service"
    schedule:
      interval: "weekly"
