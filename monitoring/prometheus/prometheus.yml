global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:5000']

  - job_name: 'catalog-service'
    static_configs:
      - targets: ['catalog-service:8080']

  - job_name: 'order-service'
    static_configs:
      - targets: ['order-service:8000']
