version: '3.8'

services:
  # API Gateway (Nginx Reverse Proxy)
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: dev-api-gateway
    ports:
      - "80:80"
    depends_on:
      user-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Frontend Application
  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: dev-frontend
    expose:
      - "80"
    depends_on:
      - user-service
      - catalog-service
      - order-service

  # User Service (Node.js/Express)
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: dev-user-service
    environment:
      - PORT=5000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=devuser
      - DB_PASSWORD=devpassword
      - DB_NAME=microservices_db
    expose:
      - "5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5000/health').then(r => r.status === 200 ? process.exit(0) : process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3

  # Catalog Service (Go/Gin)
  catalog-service:
    build:
      context: ./services/catalog-service
      dockerfile: Dockerfile
    container_name: dev-catalog-service
    environment:
      - PORT=8080
      - MONGO_URI=mongodb://devuser:devpassword@mongodb:27017/catalog_db?authSource=admin
    expose:
      - "8080"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Order Service (Python/FastAPI)
  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: dev-order-service
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://devuser:devpassword@postgres:5432/microservices_db
      - RABBITMQ_HOST=rabbitmq
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Notification Service (Python RabbitMQ Consumer)
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: dev-notification-service
    environment:
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: dev-postgres
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: microservices_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d microservices_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: dev-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: devuser
      MONGO_INITDB_ROOT_PASSWORD: devpassword
      MONGO_INITDB_DATABASE: catalog_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand({ping: 1})' --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: dev-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus (Metrics Collector)
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: dev-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - user-service
      - catalog-service
      - order-service

  # Grafana (Metrics & Logs Visualizer)
  grafana:
    image: grafana/grafana:11.0.0
    container_name: dev-grafana
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

  # Loki (Centralized Log Aggregator)
  loki:
    image: grafana/loki:2.9.8
    container_name: dev-loki
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/tmp/loki
    ports:
      - "3100:3100"

  # Promtail (Docker Logs Collector Agent)
  promtail:
    image: grafana/promtail:2.9.8
    container_name: dev-promtail
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/log:/var/log
    depends_on:
      - loki

volumes:
  postgres_data:
  mongo_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  loki_data:
